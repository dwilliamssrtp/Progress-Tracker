  /* ---------------- admin: manage program (Tracks, Key Objectives, items, hierarchy) ---------------- */
  function renderProgram(){
    if(!state.program){ return '<div class="hint">Loading program…</div>'; }
    var out = '';
    if(state.programError){ out += '<p class="error-text" style="margin:0 0 12px;">'+esc(state.programError)+'</p>'; }

    var tracks = state.program.tracks;

    out += '<div class="admin-section"><h2>Tracks</h2>' +
      '<p class="hint">A Track is a role or program — Engineer Trainee, Sales, Operations, whatever fits. Each Key Objective belongs to one Track, and an employee only ever sees the objectives on their own Track.</p>';
    if(tracks.length===0){ out += '<div class="hint">No tracks yet — create one below.</div>'; }
    tracks.forEach(function(t){ out += renderProgramTrack(t); });
    var nt = state.newTrackDraft;
    out += '<div class="inline-add-row" style="margin-top:10px;">' +
        '<input type="text" data-newtrack="name" placeholder="Track name (e.g. Sales)" value="'+esc(nt.name)+'" style="min-width:180px;">' +
        '<input type="text" data-newtrack="description" placeholder="Description (optional)" value="'+esc(nt.description)+'" style="flex:1; min-width:220px;">' +
        '<button class="btn btn-primary btn-sm" id="createTrackBtn">Create track</button>' +
      '</div>' +
    '</div>';

    var filterTrackId = state.programTrackFilter;
    var currentTrack = tracks.filter(function(t){ return t.id===filterTrackId; })[0];
    var phasesInTrack = state.program.phases.filter(function(p){ return p.trackId===filterTrackId; });

    out += '<div class="admin-section"><h2>Key Objectives</h2>';
    if(tracks.length===0){
      out += '<div class="hint">Create a track above first.</div>';
    } else {
      out += '<div class="field-group" style="max-width:320px; margin-bottom:14px;"><label>Track</label><select id="programTrackSelect">' +
          tracks.map(function(t){ return '<option value="'+esc(t.id)+'"'+(filterTrackId===t.id?' selected':'')+'>'+esc(t.name)+'</option>'; }).join('') +
        '</select></div>';
      if(phasesInTrack.length===0){ out += '<div class="hint">No Key Objectives on this track yet — create one below.</div>'; }
      phasesInTrack.forEach(function(p){ out += renderProgramPhase(p); });

      var np = state.newPhaseDraft;
      out += '<div class="program-sub"><h3>Create Key Objective'+(currentTrack?(' on '+esc(currentTrack.name)):'')+'</h3><div class="create-form">' +
          '<div class="field-group"><label>Title</label><input type="text" data-newphase="title" value="'+esc(np.title)+'"></div>' +
          '<div class="field-group"><label>Tag</label><input type="text" data-newphase="tag" placeholder="e.g. 1, 2A" value="'+esc(np.tag)+'"></div>' +
          '<div class="field-group"><label>Timeframe</label><input type="text" data-newphase="range" placeholder="e.g. Months 1–3" value="'+esc(np.range)+'"></div>' +
          '<div class="field-group"><label>Location</label><input type="text" data-newphase="location" value="'+esc(np.location)+'"></div>' +
          '<div class="field-group"><label>Reports to</label><input type="text" data-newphase="reporting" value="'+esc(np.reporting)+'"></div>' +
          '<div class="field-group"><label>Key output</label><input type="text" data-newphase="output" value="'+esc(np.output)+'"></div>' +
          '<div class="field-group" style="grid-column:1/-1"><label>Description</label><textarea class="field-input" data-newphase="objective">'+esc(np.objective)+'</textarea></div>' +
          '<div class="field-group"><button class="btn btn-primary" id="createPhaseBtn">Create Key Objective</button></div>' +
        '</div></div>';
    }
    out += '</div>';

    out += '<div class="admin-section"><h2>Employees &amp; Tracks</h2>';
    var traineeAccts = state.program.trainees;
    if(traineeAccts.length===0){ out += '<div class="hint">No employees yet.</div>'; }
    else {
      out += '<div class="table-wrap"><table class="accounts"><thead><tr><th>Name</th><th>Current Track</th><th>Reassign to</th><th></th></tr></thead><tbody>';
      traineeAccts.forEach(function(t){
        var currentTrackName = (tracks.filter(function(tr){ return tr.id===t.TrackId; })[0]||{}).name || '—';
        var pending = state.traineeTrackDrafts[t.TraineeId] !== undefined ? state.traineeTrackDrafts[t.TraineeId] : t.TrackId;
        out += '<tr><td>'+esc(t.Name)+'</td><td>'+esc(currentTrackName)+'</td>' +
          '<td><select data-traineetrack="'+esc(t.TraineeId)+'">' +
            tracks.map(function(tr){ return '<option value="'+esc(tr.id)+'"'+(pending===tr.id?' selected':'')+'>'+esc(tr.name)+'</option>'; }).join('') +
          '</select></td>' +
          '<td><button class="btn btn-ghost btn-sm" data-savetraineetrack="'+esc(t.TraineeId)+'">Save</button></td></tr>';
      });
      out += '</tbody></table></div>';
    }
    out += '</div>';

    return out;
  }

  function renderProgramTrack(t){
    if(!state.trackDrafts[t.id]){ state.trackDrafts[t.id] = {name:t.name, description:t.description}; }
    var d = state.trackDrafts[t.id];
    return '<div class="program-phase"><div class="program-phase-body" style="border-top:none; padding-top:14px;">' +
        '<div class="create-form">' +
          '<div class="field-group"><label>Name</label><input type="text" data-trackfield="'+esc(t.id)+':name" value="'+esc(d.name)+'"></div>' +
          '<div class="field-group" style="grid-column:span 2;"><label>Description</label><input type="text" data-trackfield="'+esc(t.id)+':description" value="'+esc(d.description)+'"></div>' +
        '</div>' +
        '<div class="action-row" style="margin-top:8px;">' +
          '<button class="btn btn-primary btn-sm" data-savetrack="'+esc(t.id)+'">Save</button>' +
          '<button class="btn btn-danger-outline btn-sm" data-deletetrack="'+esc(t.id)+'">Delete track</button>' +
        '</div>' +
      '</div></div>';
  }

  function renderProgramPhase(p){
    if(!state.phaseDrafts[p.id]){
      state.phaseDrafts[p.id] = {title:p.title, tag:p.tag, range:p.range, location:p.location, reporting:p.reporting, output:p.output, objective:p.objective, trackId:p.trackId};
    }
    var d = state.phaseDrafts[p.id];
    var isOpen = !!state.expandedProgram[p.id];
    var items = state.program.itemDefs.filter(function(i){ return i.Phase===p.id; }).sort(function(a,b){ return (a.Order||0)-(b.Order||0); });

    var out = '<div class="program-phase">';
    out += '<div class="program-phase-head" data-toggleprogram="'+esc(p.id)+'">' +
        '<span class="tag">'+esc(p.tag)+'</span>' +
        '<span class="title">'+esc(p.title)+'</span>' +
        '<span class="range">'+esc(p.range)+'</span>' +
        '<span class="chev">'+icon('chev')+'</span>' +
      '</div>';

    if(isOpen){
      out += '<div class="program-phase-body">';

      out += '<div class="program-sub"><h3>Details</h3><div class="create-form">' +
          '<div class="field-group"><label>Title</label><input type="text" data-phasefield="'+esc(p.id)+':title" value="'+esc(d.title)+'"></div>' +
          '<div class="field-group"><label>Tag</label><input type="text" data-phasefield="'+esc(p.id)+':tag" value="'+esc(d.tag)+'"></div>' +
          '<div class="field-group"><label>Track</label><select data-phasefield="'+esc(p.id)+':trackId">' +
            state.program.tracks.map(function(t){ return '<option value="'+esc(t.id)+'"'+(d.trackId===t.id?' selected':'')+'>'+esc(t.name)+'</option>'; }).join('') +
          '</select></div>' +
          '<div class="field-group"><label>Timeframe</label><input type="text" data-phasefield="'+esc(p.id)+':range" value="'+esc(d.range)+'"></div>' +
          '<div class="field-group"><label>Location</label><input type="text" data-phasefield="'+esc(p.id)+':location" value="'+esc(d.location)+'"></div>' +
          '<div class="field-group"><label>Reports to</label><input type="text" data-phasefield="'+esc(p.id)+':reporting" value="'+esc(d.reporting)+'"></div>' +
          '<div class="field-group"><label>Key output</label><input type="text" data-phasefield="'+esc(p.id)+':output" value="'+esc(d.output)+'"></div>' +
          '<div class="field-group" style="grid-column:1/-1"><label>Description</label><textarea class="field-input" data-phasefield="'+esc(p.id)+':objective">'+esc(d.objective)+'</textarea></div>' +
        '</div>' +
        '<div class="action-row" style="margin-top:10px;">' +
          '<button class="btn btn-primary btn-sm" data-savephase="'+esc(p.id)+'">Save changes</button>' +
          '<button class="btn btn-danger-outline btn-sm" data-deletephase="'+esc(p.id)+'">Delete Key Objective</button>' +
        '</div></div>';

      out += '<div class="program-sub"><h3>Checklist Items</h3>';
      if(items.length===0){ out += '<div class="hint">No items yet.</div>'; }
      items.forEach(function(it){ out += renderProgramItem(it); });
      var ni = state.newItemDraft[p.id] || {kind:'activity', text:''};
      out += '<div class="inline-add-row">' +
          '<select data-newitem-kind="'+esc(p.id)+'">' +
            '<option value="activity"'+(ni.kind==='activity'?' selected':'')+'>Activity</option>' +
            '<option value="criterion"'+(ni.kind==='criterion'?' selected':'')+'>Criterion</option>' +
          '</select>' +
          '<input type="text" data-newitem-text="'+esc(p.id)+'" placeholder="Describe the checklist item…" value="'+esc(ni.text)+'" style="flex:1; min-width:220px;">' +
          '<button class="btn btn-primary btn-sm" data-additem="'+esc(p.id)+'">Add item</button>' +
        '</div></div>';

      out += renderProgramReviewers(p.id);

      out += '</div>';
    }
    out += '</div>';
    return out;
  }

  function renderProgramItem(it){
    var draftKey = 'item:'+it.ItemId;
    if(state.phaseDrafts[draftKey] === undefined) state.phaseDrafts[draftKey] = it.Text;
    var val = state.phaseDrafts[draftKey];
    return '<div class="program-item-row">' +
        '<span class="kindtag">'+esc(it.Kind)+'</span>' +
        '<textarea class="field-input" data-itemtext="'+esc(it.ItemId)+'">'+esc(val)+'</textarea>' +
        '<div style="display:flex; flex-direction:column; gap:6px;">' +
          '<button class="btn btn-ghost btn-sm" data-saveitem="'+esc(it.ItemId)+'">Save</button>' +
          '<button class="btn btn-danger-outline btn-sm" data-deleteitem="'+esc(it.ItemId)+'">Delete</button>' +
        '</div>' +
      '</div>';
  }

  function renderProgramReviewers(phaseId){
    var assignments = state.program.reviewerAssignments.filter(function(a){ return String(a.PhaseId)===String(phaseId); });
    var accountsById = {}; state.program.accounts.forEach(function(a){ accountsById[a.accountId] = a; });
    var traineesById = {}; state.program.trainees.forEach(function(t){ traineesById[t.TraineeId] = t.Name; });
    var eligibleAccounts = state.program.accounts.filter(function(a){ return a.role==='Admin' || SUPERVISOR_ROLES.indexOf(a.role)!==-1; });

    var out = '<div class="program-sub"><h3>Who Reviews This</h3>' +
      '<p class="hint">Set a program-wide default reviewer, or override it for one specific employee. With nothing set here, anyone with a supervisor-level role can review.</p>' +
      '<div>';
    if(assignments.length===0){ out += '<span class="hint">No reviewers assigned yet.</span>'; }
    assignments.forEach(function(a){
      var acc = accountsById[a.ReviewerAccountId];
      var accName = esc(acc?acc.name:a.ReviewerAccountId);
      var label = a.TraineeId ? (esc(traineesById[a.TraineeId]||a.TraineeId)+' &rarr; '+accName) : ('All employees &rarr; '+accName);
      out += '<span class="reviewer-chip">'+label+'<button data-removereviewer="'+esc(a.AssignmentId)+'" title="Remove">&times;</button></span>';
    });
    out += '</div>';

    var nd = state.newReviewerDraft[phaseId] || {traineeId:'', accountId:''};
    out += '<div class="inline-add-row">' +
        '<select data-newreviewer-trainee="'+esc(phaseId)+'">' +
          '<option value="">All employees (default)</option>' +
          state.program.trainees.map(function(t){ return '<option value="'+esc(t.TraineeId)+'"'+(nd.traineeId===t.TraineeId?' selected':'')+'>'+esc(t.Name)+' only</option>'; }).join('') +
        '</select>' +
        '<select data-newreviewer-account="'+esc(phaseId)+'">' +
          '<option value="">Reviewer…</option>' +
          eligibleAccounts.map(function(a){ return '<option value="'+esc(a.accountId)+'"'+(nd.accountId===a.accountId?' selected':'')+'>'+esc(a.name)+' ('+esc(a.role)+')</option>'; }).join('') +
        '</select>' +
        '<button class="btn btn-ghost btn-sm" data-addreviewer="'+esc(phaseId)+'">Add reviewer</button>' +
      '</div></div>';
    return out;
  }

  /* ---------------- identity / password modal ---------------- */
  function showAccountModal(){
    if(document.getElementById('acctVeil')) return;
    var veil = document.createElement('div');
    veil.className = 'modal-veil'; veil.id = 'acctVeil';
    veil.innerHTML = '<div class="modal">' +
      '<h2>'+esc(state.account.name)+'</h2>' +
      '<p class="sub">'+esc(state.account.role)+'</p>' +
      '<div class="field-group"><label>Current password</label><input type="password" id="pwOld"></div>' +
      '<div class="field-group"><label>New password</label><input type="password" id="pwNew" placeholder="min. 6 characters"></div>' +
      '<div id="pwError" class="error-text" hidden></div>' +
      '<div class="action-row">' +
        '<button class="btn btn-primary" id="pwSave">Change password</button>' +
        '<button class="btn btn-ghost" id="pwCancel">Cancel</button>' +
      '</div>' +
      '<div class="action-row" style="margin-top:16px; border-top:1px solid var(--border); padding-top:14px;">' +
        '<button class="btn btn-danger-outline" id="logoutBtn">Log out</button>' +
      '</div>' +
    '</div>';
    document.body.appendChild(veil);
    document.getElementById('pwCancel').addEventListener('click', function(){ veil.remove(); });
    document.getElementById('logoutBtn').addEventListener('click', function(){ veil.remove(); clearAuth(); render(); });
    document.getElementById('pwSave').addEventListener('click', function(){
      var oldPw = document.getElementById('pwOld').value;
      var newPw = document.getElementById('pwNew').value;
      apiPost('changePassword', {oldPassword:oldPw, newPassword:newPw}).then(function(res){
        if(!res.ok){
          var e = document.getElementById('pwError'); e.hidden=false; e.textContent = res.error || 'Could not change password';
          return;
        }
        veil.remove();
      });
    });
  }

  function showTraineeInfoModal(){
    if(document.getElementById('infoVeil')) return;
    var veil = document.createElement('div');
    veil.className = 'modal-veil'; veil.id = 'infoVeil';
    var t = state.trainee || {};
    veil.innerHTML = '<div class="modal">' +
      '<h2>Trainee info</h2>' +
      '<p class="sub">Shown in the roster and header for everyone viewing this tracker.</p>' +
      '<div class="field-group"><label>Name</label><input type="text" id="tName" value="'+esc(t.name||'')+'"></div>' +
      '<div class="field-group"><label>Program start date</label><input type="date" id="tStart" value="'+esc(t.startDate||'')+'"></div>' +
      '<div class="action-row"><button class="btn btn-primary" id="tSave">Save</button><button class="btn btn-ghost" id="tCancel">Cancel</button></div>' +
    '</div>';
    document.body.appendChild(veil);
    document.getElementById('tCancel').addEventListener('click', function(){ veil.remove(); });
    document.getElementById('tSave').addEventListener('click', function(){
      var n = document.getElementById('tName').value.trim();
      var s = document.getElementById('tStart').value;
      veil.remove();
      saveTraineeMeta(n, s);
    });
  }

  function showResetPasswordModal(accountId){
    if(document.getElementById('resetVeil')) return;
    var veil = document.createElement('div');
    veil.className = 'modal-veil'; veil.id = 'resetVeil';
    veil.innerHTML = '<div class="modal">' +
      '<h2>Reset password</h2>' +
      '<p class="sub">Sets a new password for this account immediately.</p>' +
      '<div class="field-group"><label>New password</label><input type="text" id="resetPw" placeholder="min. 6 characters"></div>' +
      '<div id="resetError" class="error-text" hidden></div>' +
      '<div class="action-row"><button class="btn btn-primary" id="resetSave">Set password</button><button class="btn btn-ghost" id="resetCancel">Cancel</button></div>' +
    '</div>';
    document.body.appendChild(veil);
    document.getElementById('resetCancel').addEventListener('click', function(){ veil.remove(); });
    document.getElementById('resetSave').addEventListener('click', function(){
      var pw = document.getElementById('resetPw').value;
      apiPost('resetPassword', {accountId:accountId, newPassword:pw}).then(function(res){
        if(!res.ok){ var e=document.getElementById('resetError'); e.hidden=false; e.textContent=res.error||'Failed'; return; }
        veil.remove();
      });
    });
  }

  /* ---------------- events ---------------- */
  function wireEvents(){
    var chip = document.getElementById('identityChip');
    if(chip) chip.addEventListener('click', showAccountModal);
    var back = document.getElementById('backToRosterBtn');
    if(back) back.addEventListener('click', backToRoster);
    var info = document.getElementById('programInfoBtn');
    if(info) info.addEventListener('click', showTraineeInfoModal);

    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function(btn){
      btn.addEventListener('click', function(){
        var tab = btn.getAttribute('data-tab');
        if(tab==='admin') openAdmin(); else if(tab==='program') openProgram(); else backToRoster();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-open-trainee]'), function(btn){
      btn.addEventListener('click', function(){ openTrainee(btn.getAttribute('data-open-trainee')); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.phase-card'), function(btn){
      btn.addEventListener('click', function(){ state.activePhase = btn.getAttribute('data-phase'); render(); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-toggle]'), function(row){
      row.addEventListener('click', function(){
        var id = row.getAttribute('data-toggle');
        state.expanded[id] = !state.expanded[id];
        render();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-note]'), function(ta){
      ta.addEventListener('input', function(){
        state.drafts[ta.getAttribute('data-note')] = ta.value;
        focusRestore = {id: ta.getAttribute('data-note'), kind:'note', pos: ta.selectionStart};
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-reason]'), function(ta){
      ta.addEventListener('input', function(){
        state.reviewDrafts[ta.getAttribute('data-reason')] = ta.value;
        focusRestore = {id: ta.getAttribute('data-reason'), kind:'reason', pos: ta.selectionStart};
      });
    });

    bindClick('[data-submit]', 'data-submit', function(def){ submitDone(def); });
    bindClick('[data-withdraw]', 'data-withdraw', function(def){ withdraw(def); });
    bindClick('[data-approve]', 'data-approve', function(def){ approve(def); });
    bindClick('[data-reject]', 'data-reject', function(def){ requestChanges(def); });
    bindClick('[data-markcomplete]', 'data-markcomplete', function(def){ markComplete(def); });

    Array.prototype.forEach.call(document.querySelectorAll('[data-reset-account]'), function(btn){
      btn.addEventListener('click', function(){ showResetPasswordModal(btn.getAttribute('data-reset-account')); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-draft]'), function(el){
      el.addEventListener('input', function(){ state.newAcctDraft[el.getAttribute('data-draft')] = el.value; });
      el.addEventListener('change', function(){ state.newAcctDraft[el.getAttribute('data-draft')] = el.value; });
    });

    var roleSel = document.getElementById('newAcctRole');
    var startWrap = document.getElementById('newAcctStartWrap');
    var trackWrap = document.getElementById('newAcctTrackWrap');
    if(roleSel && startWrap){
      var syncStartVisibility = function(){
        var isTrainee = roleSel.value==='Trainee';
        startWrap.style.display = isTrainee ? '' : 'none';
        if(trackWrap) trackWrap.style.display = isTrainee ? '' : 'none';
      };
      syncStartVisibility();
      roleSel.addEventListener('change', syncStartVisibility);
    }
    var createBtn = document.getElementById('createAcctBtn');
    if(createBtn){
      createBtn.addEventListener('click', function(){
        var d = state.newAcctDraft;
        var payload = {
          name: d.name.trim(), username: d.username.trim(), role: d.role,
          email: d.email.trim(), password: d.password, startDate: d.startDate, trackId: d.trackId
        };
        apiPost('createAccount', payload).then(function(res){
          if(!res.ok){ state.adminError = res.error || 'Could not create account'; render(); return; }
          state.adminError = '';
          var keepTrack = state.newAcctDraft.trackId;
          state.newAcctDraft = {name:'', username:'', role:'Trainee', startDate:'', trackId:keepTrack, email:'', password:''};
          loadAdmin();
        });
      });
    }

    wireProgramEvents();
  }

  /* ---------------- manage program: event wiring ---------------- */
  function wireProgramEvents(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-toggleprogram]'), function(row){
      row.addEventListener('click', function(){
        var id = row.getAttribute('data-toggleprogram');
        state.expandedProgram[id] = !state.expandedProgram[id];
        render();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-phasefield]'), function(el){
      var sync = function(){
        var parts = el.getAttribute('data-phasefield').split(':');
        if(!state.phaseDrafts[parts[0]]) state.phaseDrafts[parts[0]] = {};
        state.phaseDrafts[parts[0]][parts[1]] = el.value;
      };
      el.addEventListener('input', sync);
      el.addEventListener('change', sync);
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-savephase]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-savephase');
        var d = state.phaseDrafts[id] || {};
        apiPost('updatePhase', {phaseId:id, title:d.title, tag:d.tag, trackId:d.trackId, range:d.range, location:d.location, reporting:d.reporting, output:d.output, objective:d.objective}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not save'; render(); return; }
          state.programError = ''; loadProgram(); loadState();
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-deletephase]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-deletephase');
        if(!confirm('Delete this Key Objective and all of its checklist items for every employee? This cannot be undone.')) return;
        apiPost('deletePhase', {phaseId:id}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not delete'; render(); return; }
          delete state.phaseDrafts[id]; delete state.expandedProgram[id];
          state.programError = ''; loadProgram(); loadState();
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-itemtext]'), function(ta){
      ta.addEventListener('input', function(){ state.phaseDrafts['item:'+ta.getAttribute('data-itemtext')] = ta.value; });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-saveitem]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-saveitem');
        var text = state.phaseDrafts['item:'+id];
        apiPost('updateItemDef', {itemId:id, text:text}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not save'; render(); return; }
          state.programError = ''; loadProgram(); loadState();
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-deleteitem]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-deleteitem');
        if(!confirm('Delete this checklist item for every employee? This cannot be undone.')) return;
        apiPost('deleteItemDef', {itemId:id}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not delete'; render(); return; }
          state.programError = ''; loadProgram(); loadState();
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-newitem-kind]'), function(el){
      el.addEventListener('change', function(){
        var id = el.getAttribute('data-newitem-kind');
        if(!state.newItemDraft[id]) state.newItemDraft[id] = {kind:'activity', text:''};
        state.newItemDraft[id].kind = el.value;
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-newitem-text]'), function(el){
      el.addEventListener('input', function(){
        var id = el.getAttribute('data-newitem-text');
        if(!state.newItemDraft[id]) state.newItemDraft[id] = {kind:'activity', text:''};
        state.newItemDraft[id].text = el.value;
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-additem]'), function(btn){
      btn.addEventListener('click', function(){
        var phaseId = btn.getAttribute('data-additem');
        var d = state.newItemDraft[phaseId] || {kind:'activity', text:''};
        var text = (d.text||'').trim();
        if(!text) return;
        apiPost('createItemDef', {phase:phaseId, kind:d.kind, text:text}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not add item'; render(); return; }
          state.programError = ''; state.newItemDraft[phaseId] = {kind:'activity', text:''};
          loadProgram(); loadState();
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-newreviewer-trainee]'), function(el){
      el.addEventListener('change', function(){
        var id = el.getAttribute('data-newreviewer-trainee');
        if(!state.newReviewerDraft[id]) state.newReviewerDraft[id] = {traineeId:'', accountId:''};
        state.newReviewerDraft[id].traineeId = el.value;
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-newreviewer-account]'), function(el){
      el.addEventListener('change', function(){
        var id = el.getAttribute('data-newreviewer-account');
        if(!state.newReviewerDraft[id]) state.newReviewerDraft[id] = {traineeId:'', accountId:''};
        state.newReviewerDraft[id].accountId = el.value;
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-addreviewer]'), function(btn){
      btn.addEventListener('click', function(){
        var phaseId = btn.getAttribute('data-addreviewer');
        var d = state.newReviewerDraft[phaseId] || {};
        if(!d.accountId) return;
        apiPost('setReviewerAssignment', {phaseId:phaseId, traineeId:d.traineeId||'', reviewerAccountId:d.accountId}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not add reviewer'; render(); return; }
          state.programError = ''; state.newReviewerDraft[phaseId] = {traineeId:'', accountId:''};
          loadProgram();
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-removereviewer]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-removereviewer');
        apiPost('removeReviewerAssignment', {assignmentId:id}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not remove'; render(); return; }
          state.programError = ''; loadProgram();
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-newphase]'), function(el){
      el.addEventListener('input', function(){ state.newPhaseDraft[el.getAttribute('data-newphase')] = el.value; });
    });
    var createPhaseBtn = document.getElementById('createPhaseBtn');
    if(createPhaseBtn){
      createPhaseBtn.addEventListener('click', function(){
        var d = state.newPhaseDraft;
        if(!d.title || !d.title.trim() || !state.programTrackFilter) return;
        apiPost('createPhase', {title:d.title.trim(), trackId:state.programTrackFilter, tag:d.tag, range:d.range, location:d.location, reporting:d.reporting, output:d.output, objective:d.objective}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not create'; render(); return; }
          state.programError = '';
          state.newPhaseDraft = {title:'', tag:'', range:'', location:'', reporting:'', output:'', objective:'', trackId:state.programTrackFilter};
          loadProgram(); loadState();
        });
      });
    }

    var trackSelect = document.getElementById('programTrackSelect');
    if(trackSelect){
      trackSelect.addEventListener('change', function(){
        state.programTrackFilter = trackSelect.value;
        state.newPhaseDraft.trackId = trackSelect.value;
        render();
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-newtrack]'), function(el){
      el.addEventListener('input', function(){ state.newTrackDraft[el.getAttribute('data-newtrack')] = el.value; });
    });
    var createTrackBtn = document.getElementById('createTrackBtn');
    if(createTrackBtn){
      createTrackBtn.addEventListener('click', function(){
        var d = state.newTrackDraft;
        if(!d.name || !d.name.trim()) return;
        apiPost('createTrack', {name:d.name.trim(), description:d.description}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not create track'; render(); return; }
          state.programError = '';
          state.newTrackDraft = {name:'', description:''};
          loadProgram();
        });
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-trackfield]'), function(el){
      el.addEventListener('input', function(){
        var parts = el.getAttribute('data-trackfield').split(':');
        if(!state.trackDrafts[parts[0]]) state.trackDrafts[parts[0]] = {};
        state.trackDrafts[parts[0]][parts[1]] = el.value;
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-savetrack]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-savetrack');
        var d = state.trackDrafts[id] || {};
        apiPost('updateTrack', {trackId:id, name:d.name, description:d.description}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not save'; render(); return; }
          state.programError = ''; loadProgram();
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-deletetrack]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-deletetrack');
        if(!confirm('Delete this track? It must have no Key Objectives and no employees on it.')) return;
        apiPost('deleteTrack', {trackId:id}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not delete track'; render(); return; }
          delete state.trackDrafts[id];
          if(state.programTrackFilter===id) state.programTrackFilter = '';
          state.programError = ''; loadProgram();
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-traineetrack]'), function(el){
      el.addEventListener('change', function(){ state.traineeTrackDrafts[el.getAttribute('data-traineetrack')] = el.value; });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-savetraineetrack]'), function(btn){
      btn.addEventListener('click', function(){
        var traineeId = btn.getAttribute('data-savetraineetrack');
        var trackId = state.traineeTrackDrafts[traineeId];
        if(!trackId) return;
        apiPost('setTraineeTrack', {traineeId:traineeId, trackId:trackId}).then(function(res){
          if(!res.ok){ state.programError = res.error || 'Could not reassign'; render(); return; }
          state.programError = ''; loadProgram(); loadState();
        });
      });
    });
  }

  function bindClick(sel, attr, fn){
    Array.prototype.forEach.call(document.querySelectorAll(sel), function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.getAttribute(attr);
        var def = itemDefsCache[id];
        if(def) fn(def);
      });
    });
  }

  function restoreFocus(){
    if(!focusRestore) return;
    var sel = focusRestore.kind==='note' ? '[data-note="'+focusRestore.id+'"]' : '[data-reason="'+focusRestore.id+'"]';
    var el = document.querySelector(sel);
    if(el){ el.focus(); try{ el.setSelectionRange(focusRestore.pos, focusRestore.pos); }catch(e){} }
  }

  /* ---------------- boot ---------------- */
  if(state.token) { state.view = 'roster'; loadState(); }
  render();
  setInterval(function(){
    // Skip while on Manage Accounts / Manage Program — those tabs have no
    // live roster data to refresh, and re-rendering mid-poll would wipe
    // whatever the admin is currently typing into a form.
    if(state.view==='admin' || state.view==='program') return;
    if(state.token || !apiConfigured()) loadState();
  }, POLL_MS);
})();
</script>
</body>
</html>
